name: ZSDR Cur Month Pipeline

# -----------------------------------------------------------------------
# Simple upload-triggered pipeline for the TRSP dashboard's "Upload
# data" page. Reset to a plain 4-step flow, per explicit instruction:
#
#   1. User uploads a ZSDR002 file and a TMS file.
#   2. UploadApi.gs uploads them straight to the production Drive
#      staging folder ('ZSDR_*'/'TMS_*' naming -- same convention your
#      original pipeline.yml already reads from).
#   3. UploadApi.gs dispatches THIS workflow via
#      dispatchCurMonthPipeline_() / finalizeUpload() once both files
#      are finalized.
#   4. cur_month_pipeline.py downloads the latest pair, computes
#      ZSDR002's helper columns (Workflow 1), and writes each file back
#      into the Sheet as a plain full-replace: ZSDR002 -> ZSDR_Cur_Month,
#      TMS -> TMS_Cur_Month. No shipment-level rollup, no filtering, no
#      archiving.
# -----------------------------------------------------------------------

on:
  workflow_dispatch:

jobs:
  run-cur-month-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r monthly_pipeline/requirements.txt

      - name: Run ZSDR_Cur_Month pipeline
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TARGET_SHEET_ID: ${{ secrets.TARGET_SHEET_ID }}
          STAGING_FOLDER_ID: ${{ secrets.STAGING_FOLDER_ID }}
        run: python monthly_pipeline/cur_month_pipeline.py
