name: File Abadi

# -----------------------------------------------------------------------
# "File Abadi" — pipeline for the new Jan-Dec / ZSDR002 + TMS monthly
# upload interface. It's dispatched by Code.gs (finalizeUpload ->
# dispatchDummyPipeline_) right after the Apps Script interface confirms
# a new file has landed in the monthly staging folder.
#
# SCOPE:
#   1) "Check staged files and log to Sheet" verifies Drive access and
#      writes a PASS/FAIL status into the "Log_File" tab (row = month,
#      columns = ZSDR002 / TMS).
#   2) "Run monthly workflows" implements Workflow 0-2 from the existing
#      production pipeline (TMS prep, ZSDR002 SKU-level enrichment,
#      shipment-level rollup), scoped to this month's staged files, and
#      writes the results into per-month tabs in the monthly Sheet:
#        <Mon>_TMS, <Mon>_ZSDR002, <MON>_ZSDR002_ShipLevel
#      Each tab is fully cleared and rewritten every run, so re-running
#      after a re-upload replaces the old data rather than appending.
#
# This is a SEPARATE workflow file from the existing production
# `pipeline.yml`, so it runs independently without touching the current
# TMS/ZSDR reporting pipeline.
# -----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month key passed from the Apps Script interface (e.g. Jan, Aug)'
        required: false
        type: string

jobs:
  check-access:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r monthly_pipeline/requirements.txt

      - name: Check staged files and log to Sheet
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          MONTHLY_STAGING_FOLDER_ID: ${{ secrets.MONTHLY_STAGING_FOLDER_ID }}
          MONTHLY_TARGET_SHEET_ID: ${{ secrets.MONTHLY_TARGET_SHEET_ID }}
          UPLOAD_MONTH: ${{ github.event.inputs.month }}
        run: python monthly_pipeline/check_staged_files.py

      - name: Run monthly workflows (TMS prep, ZSDR002 SKU-level, Shipment-level)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          MONTHLY_STAGING_FOLDER_ID: ${{ secrets.MONTHLY_STAGING_FOLDER_ID }}
          MONTHLY_TARGET_SHEET_ID: ${{ secrets.MONTHLY_TARGET_SHEET_ID }}
          # Reuses the SAME secret the existing production pipeline.yml
          # already has configured in this repo — this is the production
          # Sheet ID, used here only to read master data cross-sheet.
          TARGET_SHEET_ID: ${{ secrets.TARGET_SHEET_ID }}
          UPLOAD_MONTH: ${{ github.event.inputs.month }}
        run: python monthly_pipeline/run_monthly_workflows.py
