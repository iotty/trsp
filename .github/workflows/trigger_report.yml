name: Generate Logistics Report (Production)

on:
  workflow_dispatch:
    inputs:
      tms_id:
        description: 'Google Drive File ID for TMS'
        required: true
      zsdr_id:
        description: 'Google Drive File ID for ZSDR'
        required: true
      sheet_url:
        description: 'Target Google Sheet URL'
        required: false
        default: 'https://docs.google.com/spreadsheets/dummy'

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      # --- BAGIAN INI YANG SEBELUMNYA TIDAK ADA ---
      - name: Install Dependencies
        run: |
          pip install pandas google-api-python-client google-auth-httplib2 google-auth-oauthlib openpyxl gspread
      # -------------------------------------------
          
      - name: Run Pipeline Script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TMS_FILE_ID: ${{ github.event.inputs.tms_id }}
          ZSDR_FILE_ID: ${{ github.event.inputs.zsdr_id }}
          TARGET_SHEET_URL: ${{ github.event.inputs.sheet_url }}
        run: python process_report.py
