name: Archive Closed Orders

# -----------------------------------------------------------------------
# Scheduled, month-boundary step for the TRSP dashboard: moves CLOSED
# rows (Act. Gds Mvmnt Date filled) belonging to a PAST month out of
# ZSDR_Cur_Month and appends them into ZSDR_Abadi's history. Rows still
# OPEN stay in ZSDR_Cur_Month regardless of month, so nothing is lost
# just because the calendar moved on.
#
# Runs at 01:00 UTC (08:00 Asia/Jakarta) on the 1st of every month --
# safely after local midnight, so the month boundary has already
# passed locally. Also available as a manual workflow_dispatch for an
# on-demand run (e.g. to catch up after a missed schedule).
#
# See archive_closed_orders.py for the exact "closed" definition and
# why it's 'Act. Gds Mvmnt Date' and not the TMS-derived 'GI Date'.
# -----------------------------------------------------------------------

on:
  schedule:
    - cron: '0 1 1 * *'
  workflow_dispatch:

jobs:
  archive-closed-orders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r monthly_pipeline/requirements.txt

      - name: Archive closed orders into ZSDR_Abadi
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TARGET_SHEET_ID: ${{ secrets.TARGET_SHEET_ID }}
        run: python monthly_pipeline/archive_closed_orders.py
