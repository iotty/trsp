name: Logistics Pipeline Automation

on:
  workflow_dispatch:    # Mengizinkan trigger manual & via API (Apps Script)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Logistics Python Script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TARGET_SHEET_ID: ${{ secrets.TARGET_SHEET_ID }}
          STAGING_FOLDER_ID: ${{ secrets.STAGING_FOLDER_ID }}
        run: python main.py
