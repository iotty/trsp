name: File Abadi

# -----------------------------------------------------------------------
# "File Abadi" — pipeline for the new Jan-Dec / ZSDR002 + TMS monthly
# upload interface. It's dispatched by Code.gs (finalizeUpload ->
# dispatchDummyPipeline_) right after the Apps Script interface confirms
# a new file has landed in the monthly staging folder.
#
# CURRENT SCOPE: this verifies Drive access — it authenticates, looks
# for the expected ZSDR002_<month>_ and TMS_<month>_ files in the
# staging folder, and writes a PASS/FAIL status directly into the
# "Log_File" tab of the monthly Sheet (row = month, columns = ZSDR002 /
# TMS). It does NOT download or transform the actual data yet — extend
# the "Check staged files" step (or add steps after it) once real
# ingestion logic is ready.
#
# This is a SEPARATE workflow file from the existing production
# `pipeline.yml`, so it runs independently without touching the current
# TMS/ZSDR reporting pipeline.
# -----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month key passed from the Apps Script interface (e.g. Jan, Aug)'
        required: false
        type: string

jobs:
  check-access:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r monthly_pipeline/requirements.txt

      - name: Check staged files and log to Sheet
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          MONTHLY_STAGING_FOLDER_ID: ${{ secrets.MONTHLY_STAGING_FOLDER_ID }}
          MONTHLY_TARGET_SHEET_ID: ${{ secrets.MONTHLY_TARGET_SHEET_ID }}
          UPLOAD_MONTH: ${{ github.event.inputs.month }}
        run: python monthly_pipeline/check_staged_files.py
